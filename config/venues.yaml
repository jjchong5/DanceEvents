# Named-source venues/dance groups: their own calendars, not general
# keyword-search platforms. Researched 2026-09-03 (see ARCHITECTURE.md for
# the template-connector grouping this drives).
#
# Each entry:
#   platform: gcal_ical | wix | wp_events_calendar | punchpass | custom
#   styles: default style tag(s) applied to every event from this venue
#            (only meaningful when the venue's calendar doesn't self-tag)
#   confirmed_active: date this was last verified to return real, current
#            events (not just "site exists") — re-check periodically.
#
# Sources found invite-only/non-public are EXCLUDED here on purpose, not
# scraped around (see ARCHITECTURE.md's legal posture note). Currently
# excluded: Bay Area Zouk / bayzoukevents.com (calendar is by-request only,
# confirmed 2026-09-03).

