    styles: [salsa, bachata, argentine_tango]
    punchpass_org_id: "18608"
    homepage: "https://goldencitydance.com/calendar"
    confirmed_active: "2026-09-03"
    notes: "Jon's own membership confirmed active via email 2026-09-02. Recurring class series (Salsa/Bachata/Tango L1-L3 + practica), not drop-in socials -- lower priority than the venue-aggregator sources (SF Tango With.Us, NextGen WCS) that already returned 50+ real events each with zero custom parsing."

