  - slug: bacds_contra
    name: "Bay Area Country Dance Society (BACDS) — Contra"
    platform: custom  # src/connectors/custom/bacds.py -- confirmed working 2026-09-03
    styles: [contra]
    homepage: "https://bacds.org/dance-scheduler/calendars/"  # NOTE: www. subdomain has flaky DNS, use bare domain
    confirmed_active: "2026-09-03"
    notes: "Genuine multi-venue aggregator -- its own monthly page lists real Bay Area church-hall/community-center venues by code (ASE, CCB, SME, PCSF, etc, resolved via its own 'Dance Venues' legend table). 21-35 real events/month confirmed live."

  - slug: mission_city_swing
    name: "Mission City Swing"
    platform: custom  # src/connectors/custom/mission_city_swing.py -- confirmed working 2026-09-04
    styles: [west_coast_swing]
    calendar_url: "https://missioncityswing.com/classes/upcoming-class-and-event-schedule/"
    homepage: "https://missioncityswing.com"
    confirmed_active: "2026-09-04"
